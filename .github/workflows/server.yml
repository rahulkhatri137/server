name: Ubuntu_Server
on: 
  workflow_dispatch:
jobs:
  Server:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
       python-version: '3.9.2' 
    - run: sudo apt update && sudo apt install git ffmpeg; git clone https://${{ secrets.TOKEN }}@github.com/rahulkhatri137/vcomp comp; cd comp; sudo chmod 777 .; ./convertor.sh
