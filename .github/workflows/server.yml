name: Ubuntu_Server
on: 
  workflow_dispatch:
jobs:
  Server:
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
       python-version: '3.9.2' 
    - run: sudo apt update && sudo apt install git ffmpeg; git clone https://${{ secrets.TOKEN }}@github.com/rahulkhatri137/vcomp comp; cd comp; pip3 install --no-cache-dir -r requirements.txt; sudo chmod -R 777 .; sudo ./convertor.sh
